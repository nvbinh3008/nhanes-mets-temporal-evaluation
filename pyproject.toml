[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nhanes-rule-hei-full"
version = "2.1.3.2rc2"
description = "NHANES HEI-2020 temporal evaluation research code candidate"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
  "pandas==3.0.1",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "pyarrow==26.0.1",
  "joblib==1.6.0",
  "threadpoolctl==3.8.0",
  "PyYAML==6.0.3",
  "openpyxl==3.1.5",
  "reportlab==4.4.9",
  "pypdfium2==5.14.0",
  "requests==2.34.2",
  "urllib3==2.8.0",
  "xlrd==2.0.2",
  "pillow==13.0.0"
]

[project.scripts]
nhanes-etl = "nhanes_etl.cli:main"
hei-pipeline = "hei_pipeline.cli:main"
nhanes-full = "full_pipeline.cli:main"
nhanes-model = "model_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nhanes_etl*", "hei_pipeline*", "full_pipeline*", "model_pipeline*"]
